name: Build and deploy DEVIL EYE UI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript and build Tailwind CSS v4
        run: npm run build && npm run smoke
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GH_REPOSITORY}/pages`;
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
            }
          });
          if (response.status === 404) {
            console.error("GitHub Pages is not enabled for this repository yet.");
            console.error("Open Settings > Pages > Build and deployment, then set Source to GitHub Actions.");
            process.exit(1);
          }
          if (!response.ok) {
            console.error(`Could not verify GitHub Pages configuration (HTTP ${response.status}).`);
            console.error(await response.text());
            process.exit(1);
          }
          console.log("GitHub Pages site is enabled.");
          NODE
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
